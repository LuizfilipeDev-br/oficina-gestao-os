spring.application.name=oficina-backend
server.port=${PORT:8081}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/oficina_os_db}
spring.datasource.username=${DATABASE_USER:admin_oficina}
spring.datasource.password=${DATABASE_PASSWORD:oficina_password_123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

api.security.token.secret=MinhaChaveSecretaSuperSeguraParaOficinaDeComputadores2026!
api.security.token.expiration=86400000
